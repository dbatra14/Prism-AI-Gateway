[project]
name = "prism"
version = "1.0.0"
description = "An LLM gateway with smart routing and a semantic cache"
requires-python = ">=3.11"

[tool.pytest.ini_options]
# auto mode: async tests are detected by their signature, so sync and async
# tests can sit side by side in a file without per-test markers.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
